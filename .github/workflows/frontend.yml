name: Login Screen JS

on: [workflow_dispatch, push, pull_request]

# 复用工作流只在「push 到 inputs.main_git_branch 指定的分支」时回写构建产物，
# 本项目不需要 bot 提交 dist，故保持只读权限。
permissions:
  contents: write

jobs:
  run:
    uses: flarum/framework/.github/workflows/REUSABLE_frontend.yml@2.x
    with:
      enable_bundlewatch: false
      enable_prettier: true
      enable_typescript: true
      enable_tests: true

      frontend_directory: ./js
      backend_directory: .
      js_package_manager: npm
      # REUSABLE_frontend.yml 没有提供关闭回写的开关，它内部的判定是：
      #   do_not_commit = github.ref != 'refs/heads/<main_git_branch>' || event_name != 'push'
      # 这里故意填一个不存在的分支名，让该表达式恒为 true，从而跳过 dist 提交。
      main_git_branch: __no_auto_commit__
    secrets:
      bundlewatch_github_token: ${{ secrets.BUNDLEWATCH_GITHUB_TOKEN }}
